<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS函数</title>
</head>
<body>
    <!-- 写一个随机数的猜数游戏，计算机随机给出一定范围的随机数，学生输入猜测的数字，
     计算机给出数字大了或者小了，直到猜中或者到达指定的猜测次数-->>
     <button onclick="gessNum()">猜猜我是几？</button>
     <script>
        //匿名函数
        var gessNum = function(){
            // Math.floor取整，Math.random()是【0,1)之间的随机数
            let num = getRandomNum(1, 25);
            let count = 0;
            while (count < 5){
                let input = prompt("请输入你猜的数字：");
                if (input == null) {
                    alert("游戏结束！");
                    return;
                }
                input = parseInt(input);
                if (isNaN(input)) {
                    alert("请输入一个有效的数字！");
                    continue;
                }
                if (input < num) {
                    alert("你猜的数字小了！");
                } else if (input > num) {
                    alert("你猜的数字大了！");
                } else {
                    alert("恭喜你，猜对了！");
                    return;
                }
                count++;
            }
            alert("很遗憾，你没有猜中，正确的数字是：" + num);
        }
        //获取从min到max的随机数
        //箭头函数
        var getRandomNum = (min, max) => {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
     </script>
</body>
</html>
